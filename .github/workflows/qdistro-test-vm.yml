name: qdistro downloadable VM test image

# Builds a downloadable qdistro test VM on a free GitHub runner:
#   1. native components in rootless Podman (scripts/vm/build-native-podman.sh,
#      the same builder the local qci cloud test bases use), against the
#      Tumbleweed snapshot pinned in snapshot.conf;
#   2. offline copy of that stage plus the source tree into the signed,
#      SHA256-pinned Minimal-VM cloud QCOW2;
#   3. in the booted guest, runtime packages from the same snapshot and the
#      qdistro bootstrap chain (scripts/vm/test-vm-guest-install.sh): the
#      QML shell, Python services, greeter and locker. Build tools stay in
#      the container; this is a test VM, not a release image.
on:
  push:
    branches: [experiment/github-qdistro-image]
    paths:
      - .github/workflows/qdistro-test-vm.yml
      - scripts/vm/test-vm-guest-install.sh
      - snapshot.conf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LIBGUESTFS_BACKEND: direct
    steps:
      - uses: actions/checkout@v4

      - name: Set up paths, KVM and the snapshot pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qdistro-vm" "$RUNNER_TEMP/qdistro-cache" "$RUNNER_TEMP/qdistro-cloud"
          echo "VM_DIR=$RUNNER_TEMP/qdistro-vm" >> "$GITHUB_ENV"
          echo "VM_IMAGE=$RUNNER_TEMP/qdistro-vm/qdistro-test-vm.qcow2" >> "$GITHUB_ENV"
          echo "CLOUD_CACHE=$RUNNER_TEMP/qdistro-cloud/cloud-base.qcow2" >> "$GITHUB_ENV"
          echo "QDWIN_CACHE_DIR=$RUNNER_TEMP/qdistro-cache" >> "$GITHUB_ENV"
          echo "DISK_BASELINE=$(df -B1 --output=used / | tail -1 | tr -d ' ')" >> "$GITHUB_ENV"
          # Hosted Linux runners expose /dev/kvm to root only.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -w /dev/kvm ]; then
            echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
            echo "LIBGUESTFS_BACKEND_SETTINGS=force_tcg" >> "$GITHUB_ENV"
          fi
          . scripts/vm/lib/test-substrate.sh
          qdistro_load_test_substrate
          {
            echo "SNAPSHOT=$QDISTRO_SUBSTRATE_SNAPSHOT"
            echo "CLOUD_URL=$QDISTRO_SUBSTRATE_CLOUD_URL"
            echo "CLOUD_SHA256=$QDISTRO_SUBSTRATE_CLOUD_SHA256"
          } >> "$GITHUB_ENV"
          echo "snapshot $QDISTRO_SUBSTRATE_SNAPSHOT, cloud $QDISTRO_SUBSTRATE_CLOUD_SHA256"
          ls -l /dev/kvm || true
          nproc; free -g; df -h /
          podman --version

      - name: Compile native components in rootless Podman
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          archive=$(bash scripts/vm/build-native-podman.sh)
          cp "$archive" "$VM_DIR/native-stage.tar"
          tar -tf "$VM_DIR/native-stage.tar" | wc -l
          du -h "$VM_DIR/native-stage.tar"
          df -h /

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libguestfs-tools libguestfs-xfs xfsprogs qemu-utils \
            qemu-system-x86 ovmf cloud-image-utils gnupg wget jq openssh-client
          # libguestfs builds its appliance from the host kernel, which the
          # runner keeps root-only.
          sudo install -m 0644 "/boot/vmlinuz-$(uname -r)" "$VM_DIR/vmlinuz-$(uname -r)"
          echo "SUPERMIN_KERNEL=$VM_DIR/vmlinuz-$(uname -r)" >> "$GITHUB_ENV"
          echo "SUPERMIN_MODULES=/lib/modules/$(uname -r)" >> "$GITHUB_ENV"

      - name: Restore the verified cloud image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qdistro-cloud
          key: qdistro-cloud-${{ env.CLOUD_SHA256 }}

      - name: Copy the stage and source into the signed cloud QCOW2
        shell: bash
        run: |
          set -euo pipefail
          . scripts/vm/lib/opensuse-cloud-image.sh
          . scripts/vm/lib/test-substrate.sh
          qdistro_load_test_substrate
          # openSUSE signature, then the snapshot.conf pin.
          download_verified_cloud_image "$CLOUD_URL" "$CLOUD_CACHE" "$CLOUD_SHA256"
          qemu-img create -f qcow2 "$VM_IMAGE" 8G
          virt-resize --expand /dev/sda3 "$CLOUD_CACHE" "$VM_IMAGE"
          git archive --format=tar --prefix=qdistro-src/ HEAD > "$VM_DIR/source.tar"
          # The guest takes only the snapshot repositories; the stamp is what
          # the installer and qci compare the native stage against.
          qdistro_substrate_repo_command > "$VM_DIR/substrate-repos.sh"
          guestfish --rw -a "$VM_IMAGE" <<EOF
          run
          mount /dev/sda3 /
          xfs-growfs /
          tar-in $VM_DIR/native-stage.tar /
          tar-in $VM_DIR/source.tar /root
          upload $VM_DIR/substrate-repos.sh /root/qdistro-substrate-repos.sh
          EOF
          rm -f "$VM_DIR/source.tar"
          qemu-img check "$VM_IMAGE"
          df -h /

      - name: Boot the guest and install qdistro
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$VM_DIR/builder-key"
          {
            printf '#cloud-config\n'
            printf 'users:\n  - name: admin\n    uid: 1000\n    groups: [wheel]\n    shell: /bin/bash\n    sudo: "ALL=(ALL) NOPASSWD:ALL"\n    ssh_authorized_keys:\n'
            printf '      - %s\n' "$(cat "$VM_DIR/builder-key.pub")"
            printf 'ssh_pwauth: false\ndisable_root: true\n'
            printf 'runcmd:\n  - [systemctl, enable, --now, sshd.service]\n'
          } > "$VM_DIR/user-data"
          printf 'instance-id: qdistro-test-vm\nlocal-hostname: qdistro-test-vm\n' > "$VM_DIR/meta-data"
          cloud-localds "$VM_DIR/seed.img" "$VM_DIR/user-data" "$VM_DIR/meta-data"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$VM_DIR/OVMF_VARS.fd"

          boot_vm() {
            qemu-system-x86_64 -machine "q35,accel=$QEMU_ACCEL" -cpu max -m 6144 -smp "$(nproc)" \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file="$VM_DIR/OVMF_VARS.fd" \
              -drive if=virtio,format=qcow2,file="$VM_IMAGE" \
              -drive if=virtio,format=raw,readonly=on,file="$VM_DIR/seed.img" \
              -netdev user,id=vmnet,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=vmnet \
              -display none -serial file:"$VM_DIR/serial-$1.log" -monitor none \
              > "$VM_DIR/qemu-$1.log" 2>&1 &
            qemu_pid=$!
          }
          vmssh() {
            ssh -i "$VM_DIR/builder-key" -p 2222 \
              -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -o ServerAliveInterval=30 -o LogLevel=ERROR \
              admin@127.0.0.1 "$@"
          }
          wait_ssh() {
            for _ in $(seq 1 120); do
              if vmssh 'sudo -n true' >/dev/null 2>&1; then return 0; fi
              kill -0 "$qemu_pid" 2>/dev/null || break
              sleep 5
            done
            tail -120 "$VM_DIR/serial-$1.log"
            return 1
          }
          wait_down() {
            for _ in $(seq 1 90); do
              kill -0 "$qemu_pid" 2>/dev/null || return 0
              sleep 2
            done
            echo "guest did not power off; killing QEMU" >&2
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            return 1
          }
          trap 'df -h /; du -h "$VM_IMAGE"; kill "$qemu_pid" 2>/dev/null || true' EXIT

          boot_vm install
          wait_ssh install
          SECONDS=0
          vmssh 'sudo -n bash /root/qdistro-substrate-repos.sh && sudo -n rm -f /root/qdistro-substrate-repos.sh'
          vmssh 'sudo -n bash /root/qdistro-src/scripts/vm/test-vm-guest-install.sh' 2>&1 \
            | tee "$VM_DIR/guest-install.log"
          echo "guest install took ${SECONDS}s"
          vmssh 'df -h /; rpm -qa | wc -l'

          # Headless qdwin: the shell plugin loads and answers its probe.
          vmssh 'set -eu; export XDG_RUNTIME_DIR=/run/user/1000; \
            export LD_LIBRARY_PATH=/usr/libexec/qdistro/qdwin-libweston/lib64; \
            export WESTON_MODULE_MAP=headless-backend.so=/usr/libexec/qdistro/qdwin-libweston/lib64/libweston-16/headless-backend.so; \
            export WAYLAND_DISPLAY=wayland-ci; \
            timeout 20s weston --backend=headless-backend.so --renderer=pixman \
              --shell=qdwin-shell.so --socket=wayland-ci \
              --idle-time=0 --log=/tmp/qdistro-weston.log & compositor_pid=$!; \
            ready=0; for attempt in $(seq 1 50); do \
              if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then ready=1; break; fi; \
              if ! kill -0 "$compositor_pid" 2>/dev/null; then break; fi; sleep 0.2; \
            done; \
            if test "$ready" -eq 1; then qdwin-probe --timeout=5; fi; \
            wait "$compositor_pid" || rc=$?; \
            cat /tmp/qdistro-weston.log; \
            test "$ready" -eq 1; test "${rc:-0}" -eq 124; \
            grep -q "qdwin: shell loaded" /tmp/qdistro-weston.log'

          # qdshell: the installed QML tree runs on a headless qdwin for 30 s
          # with the qdshell.service environment.
          vmssh 'set -u; export XDG_RUNTIME_DIR=/run/user/1000; \
            export LD_LIBRARY_PATH=/usr/libexec/qdistro/qdwin-libweston/lib64; \
            d=/usr/libexec/qdistro/qdwin-libweston/lib64/libweston-16; \
            export WESTON_MODULE_MAP="headless-backend.so=$d/headless-backend.so;gl-renderer.so=$d/gl-renderer.so"; \
            timeout 45s weston --backend=headless-backend.so --renderer=gl \
              --shell=qdwin-shell.so --socket=wayland-shell \
              --idle-time=0 --log=/tmp/qdshell-weston.log & compositor_pid=$!; \
            for attempt in $(seq 1 50); do \
              test -S "$XDG_RUNTIME_DIR/wayland-shell" && break; sleep 0.2; \
            done; \
            test -S "$XDG_RUNTIME_DIR/wayland-shell" || { cat /tmp/qdshell-weston.log; exit 1; }; \
            env -u LD_LIBRARY_PATH -u WESTON_MODULE_MAP WAYLAND_DISPLAY=wayland-shell \
              QT_QPA_PLATFORM=wayland XDG_SESSION_TYPE=wayland QML_DISABLE_DISK_CACHE=1 \
              QML_IMPORT_PATH=/usr/share/qdistro/qml \
              timeout 30s dbus-run-session -- qs -p /usr/share/quickshell/qdshell \
              > /tmp/qdshell.log 2>&1; qs_rc=$?; \
            kill "$compositor_pid" 2>/dev/null; wait "$compositor_pid" 2>/dev/null; \
            echo "--- weston"; cat /tmp/qdshell-weston.log; \
            echo "--- qdshell (rc=$qs_rc)"; cat /tmp/qdshell.log; \
            test "$qs_rc" -eq 124' 2>&1 | tee "$VM_DIR/qdshell-smoke.log"

          # Second boot of the installed system: services and the greeter.
          vmssh 'sudo -n systemctl poweroff' || true
          wait_down
          boot_vm reboot
          wait_ssh reboot
          vmssh 'set -u; sleep 20; \
            systemctl --no-pager list-units "qdistro*" "greetd*" "seatd*"; \
            echo "--- failed units"; systemctl --no-pager --failed; \
            echo "--- greetd"; sudo -n journalctl -b -u greetd --no-pager | tail -40; \
            echo "--- bus names"; busctl --system --acquired list --no-legend | awk "{print \$1}" | grep -i qdistro; \
            fail=0; for unit in greetd.service seatd.service; do \
              systemctl is-active --quiet "$unit" || { echo "NOT ACTIVE: $unit"; fail=1; }; \
            done; \
            for name in org.qdistro.AdminBroker1 org.qdistro.SessionManager1; do \
              busctl --system --acquired list --no-legend | awk -v n="$name" "\$1==n{f=1} END{exit !f}" \
                || { echo "NOT ON BUS: $name"; fail=1; }; \
            done; \
            exit "$fail"' 2>&1 | tee "$VM_DIR/reboot-check.log"

          # Ship state: no builder key or cache; SSH stays enabled for a
          # cloud-init key, password logins are refused remotely.
          vmssh 'sudo -n sh -c "set -e; \
            zypper -n clean -a; \
            install -d -m 0755 /etc/ssh/sshd_config.d; \
            printf \"PasswordAuthentication no\nKbdInteractiveAuthentication no\n\" \
              > /etc/ssh/sshd_config.d/10-qdistro-test-vm.conf; \
            test \"\$(systemctl is-enabled sshd.service)\" = enabled; \
            cloud-init clean --logs; \
            rm -f /home/admin/.ssh/authorized_keys; \
            systemctl poweroff"' || true
          wait_down
          trap - EXIT
          qemu-img check "$VM_IMAGE"

      - name: Offline image checks and runner budget
        shell: bash
        run: |
          set -euo pipefail
          test "$(guestfish --ro -a "$VM_IMAGE" run : mount-ro /dev/sda3 / : is-file /usr/lib64/weston/qdwin-shell.so)" = true
          test "$(guestfish --ro -a "$VM_IMAGE" run : mount-ro /dev/sda3 / : is-file /usr/bin/qdgreeter)" = true
          test "$(guestfish --ro -a "$VM_IMAGE" run : mount-ro /dev/sda3 / : is-file /home/admin/.ssh/authorized_keys)" = false
          used_now="$(df -B1 --output=used / | tail -1 | tr -d ' ')"
          used_delta="$((used_now - DISK_BASELINE))"
          echo "Runner disk used since start: $used_delta bytes"
          test "$used_delta" -lt 32212254720
          qemu-img info --output=json "$VM_IMAGE" | jq -e '.format == "qcow2" and .["virtual-size"] == 8589934592 and .["backing-filename"] == null'
          (cd "$VM_DIR" && sha256sum qdistro-test-vm.qcow2 > qdistro-test-vm.qcow2.sha256)
          du -h "$VM_IMAGE"

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdistro-test-vm-logs
          path: |
            ${{ env.VM_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload downloadable test VM image
        uses: actions/upload-artifact@v4
        with:
          name: qdistro-test-vm-qcow2
          path: |
            ${{ env.VM_IMAGE }}
            ${{ env.VM_IMAGE }}.sha256
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
