# The one Tumbleweed snapshot pin for everything qdistro builds: the kiwi
# tester image and its installed zypper repos (image/build.sh), the tier-2
# container workloads (tier2/make-tier2-image.sh), the rootless Podman native
# builder, and the cloud-derived qci test VM bases (scripts/vm/lib/
# test-substrate.sh). One snapshot means one download set and one RPM cache.
#
# snapshot is the 8-digit directory under
# https://download.opensuse.org/history/ and must be at most 14 days old
# (the history service keeps roughly a month). Bump cloud_sha256 with it:
# the cloud qcow2 is re-verified against openSUSE's signed checksum. Its
# /etc/os-release VERSION_ID must equal snapshot (the scratch builder checks).
#
# cloud_url pins the per-publish dated name (...-Snapshot<snapshot>.qcow2),
# not the floating ...-Cloud.qcow2: upstream re-rolls the floating file in
# place — same name, new bytes — while the dated name keeps its content or
# 404s once a newer snapshot publishes, which is the bump signal anyway.
# test-substrate.sh refuses a Snapshot<date> that disagrees with snapshot.
schema=1
arch=x86_64
cloud_url=https://download.opensuse.org/tumbleweed/appliances/openSUSE-Tumbleweed-Minimal-VM.x86_64-1.0.0-Cloud-Snapshot20261002.qcow2
cloud_sha256=d5c261e0576bde06a6b71788be810753eaba7139a23bfccf472f8bd40bb1dc1a
snapshot=20261002
