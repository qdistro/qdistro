name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      PATH: /home/runner/.cargo/bin:/home/runner/.local/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 \
            libfontconfig1 libxrender1 \
            patch diffutils wiggle git \
            libenchant-2-2 hunspell hunspell-en-us \
            xdg-utils

      - name: Install Python packages (required + all optional)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "PyQt6>=6.5" \
            "mistune>=3.0" \
            pytest pytest-qt \
            PyYAML \
            Pygments \
            matplotlib \
            networkx \
            pyenchant

      - name: Cache cargo binaries
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-mergiraf-v1

      - name: Install Rust toolchain (if cache miss)
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install mergiraf (if cache miss)
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo install mergiraf --locked

      - name: Report tool presence
        run: |
          echo "=== system tools ==="
          which patch diff3 wiggle git mergiraf || true
          wiggle --version | head -1 || true
          mergiraf --version | head -1 || true
          echo "=== python packages ==="
          python -c "import PyQt6.QtCore; print('PyQt6', PyQt6.QtCore.QT_VERSION_STR)"
          python -c "import mistune, yaml, pygments, matplotlib, networkx, enchant" \
            && echo "all optional python deps importable"

      - name: Compile check
        run: python -m compileall -q qnotebook/ tests/

      - name: Run test suite (single process)
        run: pytest tests/ -v --tb=short --color=yes

      - name: Run test suite (per-file isolation)
        if: matrix.python-version == '3.13'
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "--- $f ---"
            pytest "$f" --tb=short --color=yes
          done

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python-version }}
          path: |
            /tmp/pytest-*
            **/*.log
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff

      # Align with the monorepo's central ruff posture: the SINGLE source of
      # truth is qdistro/ci/ruff-shared.toml (consumed by the qci host gate).
      # We check it out as a sibling and, when present, run ruff with that
      # profile as a BLOCKING step. The shared profile is calibrated GREEN on
      # this repo's current main (it enforces E/F/W/I minus the deferred
      # ratchets like F401/I001 that still have pre-existing hits here), so this
      # blocks only NEW violations and does not break the existing build.
      #
      # NOTE: this repo's plain `ruff check` (ruff defaults: E+F) is currently
      # RED here (~109 hits: F401/F811/...), which is exactly why we use the
      # shared profile rather than flipping the bare invocation to blocking.
      # The checkout is best-effort; if the profile is unreachable we fall back
      # to the previous NON-FATAL bare invocation so CI never breaks on a
      # transient checkout failure.
      - name: Checkout shared ruff profile (qdistro)
        uses: actions/checkout@v4
        with:
          repository: qdistro/qdistro
          path: .qdistro-ci
        continue-on-error: true
      - name: Ruff (shared profile, blocking when available)
        run: |
          set -euo pipefail
          CFG=.qdistro-ci/ci/ruff-shared.toml
          if [ -f "$CFG" ]; then
            echo "using shared profile: $CFG (blocking)"
            # The shared profile scopes out ONE documented pre-existing F821 in
            # qnotebook/window.py (the `"PageRef | None"` annotation whose PageRef
            # is not imported into window.py — a latent typing-resolution issue,
            # tracked as a follow-up in ci/ruff-shared.toml's F821 NOTE). The
            # central gate's per-file-ignore for it is spelled relative to the
            # qci workspace cwd (`../qnotebook/...`), which does NOT match when
            # ruff runs from THIS repo's root, so we re-apply the same carve-out
            # by its repo-local path. Everything else (incl. any NEW undefined
            # name in any OTHER file) still blocks. We use EXTEND-per-file-ignores
            # (not per-file-ignores) so this MERGES with the shared profile's
            # table rather than replacing it — so any future qnotebook-relevant
            # carve-out added centrally still applies here (no drift trap).
            # TODO: drop this override once PageRef is imported into window.py.
            ruff check --config "$CFG" \
              --config 'lint.extend-per-file-ignores = {"qnotebook/window.py" = ["F821"]}' \
              qnotebook/ tests/
          else
            # TODO: shared profile unreachable -> non-fatal fallback. Target is
            # qdistro/ci/ruff-shared.toml; make this blocking once reachable.
            echo "shared profile not found; running non-fatal bare ruff"
            ruff check qnotebook/ tests/ || echo "ruff warnings (non-fatal)"
          fi
