# /run state for the template/promotion slice (installed to
# /usr/lib/tmpfiles.d/). The per-boot runtime status files
# (/run/qdistro/silo-generation/<silo>) are written by
# qdistro-resolve-binding --record, which runs as admin via spawn-tier2 and
# the template units — so the dir must exist admin-owned on every boot, or
# the activation marker / template.binding.activated never commits (M1
# review). /run is tmpfs, so this is recreated each boot.
d /run/qdistro 0755 root root -
d /run/qdistro/silo-generation 0700 admin admin -
