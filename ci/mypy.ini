# Narrow, blocking-when-clean mypy for the qdistro security-sensitive code.
#
# Applied by the qci host gate (`gate_lint`) via:
#
#     mypy --config-file ci/mypy.ini <scoped dirs>
#
# SCOPE / RATCHET (calibrated 2026-06-11): the security-sensitive trio is
# broker/ + browser_bridge/ + cli/. mypy in this LENIENT mode (ignore missing
# imports, untyped defs NOT required) reported on current main:
#
#     cli/             0 errors   -> ENFORCED (blocking)
#     browser_bridge/  3 errors   -> ENFORCED, 1 noisy module overridden below
#     broker/         22 errors   -> ENFORCED (02/S7: all 22 fixed at the source)
#
# The blocking gate runs over cli/ + browser_bridge/ + broker/ and is GREEN. The
# broker's 22 errors were real Optional/None narrowing + assignment-type issues
# in security-sensitive code (sqlite lastrowid Optional, a `callable` typo for
# Callable, dict value-type widening, an except-name reuse, a TypeGuard for the
# nonempty-string predicate) — fixed at the source, not config-suppressed, then
# broker/ was added to host_mypy_targets in ci/bin/qci.
#
# Lenient-but-useful posture: default mypy checks only (name errors, obvious
# type mismatches, unreachable). disallow_untyped_defs is deliberately OFF — the
# code is largely unannotated and enabling it would explode with hundreds of
# annotation-required errors that carry no bug signal.

[mypy]
ignore_missing_imports = True
# Keep the default (lenient) check set. Do NOT enable disallow_untyped_defs /
# check_untyped_defs yet — those are future ratchets once the code is annotated.

[mypy-browser_bridge.qdistro_browser_bridge]
# The dynamic plugin loader uses importlib.util.spec_from_file_location, whose
# return type is Optional[ModuleSpec]; the code guards spec/spec.loader at
# runtime but mypy can't see the guard across the helper boundary. These 3
# arg-type/union-attr errors are the known importlib-Optional pattern, not bugs.
# Suppressed narrowly (only these two codes, only this module) so the rest of
# browser_bridge stays fully type-checked.
disable_error_code = arg-type, union-attr
