<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Per-uid user-relay on the system bus. Each user claims
    org.qdistro.UserRelay.uid<N>; the broker (running as root) calls
    ListLocalReceivers + Forward on them.

    The default system-bus policy forbids owning any name, so every
    uid that wants to run a relay needs an explicit allow. We can't
    wildcard <allow own="org.qdistro.UserRelay.uid*"/> by uid since
    dbus-daemon policy doesn't support "any uid" name-owning blanket
    grants — a malicious process could impersonate a different uid's
    relay and the broker would relay messages to it.

    Instead: allow any user to own org.qdistro.UserRelay.uid<their uid>
    is enforced inside the relay by uid-checking before it claims the
    name (the path formatter uses os.geteuid()). A rogue user trying
    to own uid<someone-else>'s name is blocked at the D-Bus policy
    layer by the "own" deny below combined with a targeted allow for
    the specific uids we expect.

    For Phase 3 we explicitly enumerate the two known non-admin uids
    (2000=work, 3000=work2). When Phase 4 adds dynamic user creation
    this needs a dynamic include.d approach.
  -->

  <policy user="root">
    <allow send_destination="org.qdistro.UserRelay.uid2000"/>
    <allow send_destination="org.qdistro.UserRelay.uid3000"/>
    <allow receive_sender="org.qdistro.UserRelay.uid2000"/>
    <allow receive_sender="org.qdistro.UserRelay.uid3000"/>
  </policy>

  <policy user="work">
    <allow own="org.qdistro.UserRelay.uid2000"/>
  </policy>
  <policy user="work2">
    <allow own="org.qdistro.UserRelay.uid3000"/>
  </policy>

  <!-- Nobody else: relay names are meaningful to the broker only. -->
  <policy context="default">
    <deny own="org.qdistro.UserRelay.uid2000"/>
    <deny own="org.qdistro.UserRelay.uid3000"/>
  </policy>
</busconfig>
