<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Per-uid user-relay on the system bus. Each silo claims
    org.qdistro.UserRelay.uid<N>; the broker (running as root) calls
    ListLocalReceivers + Forward on them.

    The default system-bus policy forbids owning any name, so every uid
    that runs a relay needs an explicit allow. That cannot be one wildcard
    rule: dbus policy has no "any uid may own the name matching its own
    uid" form, and <allow own_prefix="org.qdistro.UserRelay"/> granted to
    everyone would let any local process impersonate another silo's relay
    and receive whatever the broker forwarded to it.

    So the grant is per-silo — and because a silo is created and destroyed
    at runtime, it is issued and revoked WITH the silo rather than shipped
    here. qdistro-session-manager writes

        /etc/dbus-1/system.d/org.qdistro.UserRelay.silo-<name>.conf

    on CreateSilo, removes it on DeleteSilo, and reconciles the whole set
    against silos.yaml at daemon startup — so silos that predate this
    mechanism, and any fragment stranded by a crash mid-delete, are fixed
    up. See relay_policy_xml() in session_manager/qdistro_session_manager.py
    for the fragment's contents and the reasoning behind each rule.

    THIS FILE INTENTIONALLY GRANTS NOTHING.

    Until 2026-07-26 it carried a static pair of grants — username "work"
    for uid2000 and username "work2" for uid3000 — described as "the two
    known non-admin uids" pending "Phase 4 dynamic include.d". Nothing in
    the install chain ever created those users (bootstrap makes admin at
    1000 and the regular user at 1001, and no others), so the grants
    matched a real silo only if an admin happened to name one "work". The
    grant was keyed on the USERNAME, so a silo called anything else was
    refused even at uid 2000/3000, and any uid outside {2000, 3000} was
    refused whatever it was called. That is follow-up F4-a in
    doc/firefox-containers.md, and this is its fix. The static grants are
    removed rather than extended: leaving them in place would go on
    granting relay-name ownership to whoever happens to be named "work",
    silo or not.

    The file is kept rather than deleted because it is where a reader
    looking for the relay's policy will look, and because it remains the
    anchor for any future static, silo-independent relay rule.
  -->
</busconfig>
