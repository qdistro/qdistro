# Keeps pytest's rootdir and config HERE, at the component root.
#
# Without this file pytest walks up from qdshell/ and, in the qdistro
# monorepo, finds the ROOT pyproject.toml. Its [tool.pytest.ini_options]
# is for qdistro's own unit tests: it pins pytest-qt to PyQt6 and puts
# the repo root plus ~20 qdistro module directories on sys.path. None of
# that applies to this component's tests (tests/ui drives a live qdshell
# in a VM; tests/test_*.py are self-contained). As a separate repository
# qdshell had no pytest config at all, and this file restores that: an
# empty [pytest] section, rootdir = qdshell/.
[pytest]
