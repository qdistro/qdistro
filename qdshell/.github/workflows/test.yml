# Hosted-runner test workflow for qdshell: qmltest + non-strict gates.
#
# Runs ubuntu-latest. The 133 qmltest cases across Tests/tst_*.qml are
# offscreen-friendly (QT_QPA_PLATFORM=offscreen). Qt6 declarative tools
# (qmltestrunner / qmllint / qmlformat) come from the Ubuntu archive
# qt6-declarative-dev-tools package.
#
# Two stages:
#   1. ci-local.sh --quick   — qmltest only, hard-fails on any failure.
#   2. ci-local.sh           — full local run minus the integration gate
#                              (which needs a sibling qdistro repo + VM,
#                              skipped automatically when not present).
#
# `--strict` is NOT used in hosted CI: qmllint warnings inherited from
# upstream Noctalia v4.5.0 are tolerated by design. Run --strict
# locally before flipping the policy.
name: qdshell tests (hosted)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  qmltest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install Qt6 declarative tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              qt6-declarative-dev-tools \
              qt6-base-dev-tools \
              libqt6qml6 \
              bats

      - name: locate Qt6 binaries (Ubuntu layout)
        id: qtpaths
        run: |
          # Ubuntu installs to /usr/lib/qt6/bin/ rather than the
          # openSUSE /usr/lib64/qt6/bin/ ci-local.sh defaults to.
          for d in /usr/lib/qt6/bin /usr/lib/x86_64-linux-gnu/qt6/bin /usr/lib64/qt6/bin; do
              if [ -x "$d/qmltestrunner" ]; then
                  echo "QMLTEST=$d/qmltestrunner"   >> "$GITHUB_ENV"
                  echo "QMLLINT=$d/qmllint"         >> "$GITHUB_ENV"
                  echo "QMLFORMAT=$d/qmlformat"     >> "$GITHUB_ENV"
                  echo "[ci] found Qt6 tools in $d"
                  exit 0
              fi
          done
          echo "qmltestrunner not found" >&2; exit 2

      - name: ci-local.sh --quick (qmltest gate)
        run: ./scripts/ci-local.sh --quick

      - name: ci-local.sh (lint + format, non-strict, no integration)
        run: ./scripts/ci-local.sh --no-int
