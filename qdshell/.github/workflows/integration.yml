# Self-hosted integration workflow for qdshell: ci-local.sh --bats
# against a live broker-present VM. Manual trigger only.
#
# Setup (runner machine, one-time):
#   - openSUSE Tumbleweed (or compat) with Python 3.13.
#   - libvirt + qemu-kvm + virsh; a qdistro-dev VM templated from the
#     baseweed image, reachable via the `QDSHELL_TEST_VM` env var.
#   - Sibling qdistro checkout at ../qdistro (or set QDISTRO_DIR).
#   - vm-exec on PATH from /home/playai/doc/qdistro/optjan/usr/bin/.
#   - Qt6 declarative tools installed (qmltestrunner / qmllint /
#     qmlformat) — same toolchain as ci-local.sh expects.
#   - bats installed (zypper in bats).
#   - GitHub Actions runner labelled `qdistro-vm` and registered as a
#     systemd unit running as the libvirt-allowed uid (e.g. jan).
name: qdshell integration (self-hosted, manual)

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "Live broker-present VM name (overrides QDSHELL_TEST_VM)"
        required: false
        default: ""

jobs:
  bats-integration:
    runs-on: [self-hosted, qdistro-vm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: qdshell

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qdistro
          path: qdistro
        # If qdistro is local-only (no remote yet), comment the above
        # checkout step and symlink ../qdistro on the runner instead.
        continue-on-error: true

      - name: ci-local.sh (full + --bats integration)
        env:
          INPUT_VM: ${{ inputs.vm_name }}
        run: |
          set -euo pipefail
          VM="${INPUT_VM:-${QDSHELL_TEST_VM:-}}"
          if [ -z "$VM" ]; then
              echo "no VM configured (set QDSHELL_TEST_VM on runner or pass vm_name input)" >&2
              exit 2
          fi
          export PATH="/home/playai/doc/qdistro/optjan/usr/bin:$PATH"
          export QDISTRO_DIR="${QDISTRO_DIR:-$GITHUB_WORKSPACE/qdistro}"
          export VM_NAME="$VM"
          export QDISTRO_VM="$VM"
          cd qdshell
          ./scripts/ci-local.sh

      - name: upload qmltest + bats logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdshell-integration-logs
          path: |
            /tmp/qdshell-*.log
            /tmp/qdistro-*.log
          retention-days: 14
          if-no-files-found: ignore
