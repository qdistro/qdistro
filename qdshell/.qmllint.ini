# qmllint configuration for qdshell.
#
# Quickshell is the runtime that provides our QML imports (qs.Commons,
# qs.Widgets, Quickshell, etc.). It does not ship a host-side qmldir or
# qmltypes, which means qmllint cannot resolve any of those modules
# when run on the host. Every consumer site cascades into
# unqualified-access / missing-property / unresolved-type / required /
# import noise — tens of thousands of warnings, none of which are
# actionable from the host.
#
# We disable exactly those cascade categories. Everything else stays
# at its qmllint 6.11 default. Real lint over Quickshell-resolving
# types still happens in the VM at runtime (qmltestrunner does its
# own type checking when loading our 133 in-VM tests).

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
UnqualifiedAccess=disable
MissingProperty=disable
MissingType=disable
UnresolvedType=disable
UnresolvedAlias=disable
ImportFailure=disable
RequiredProperty=disable
IncompatibleType=disable
# Quick.AttachedPropertyType fires "Layout attached property must be
# attached to an object deriving from Item" on every NImageRounded /
# Item subclass that originates from qs.Widgets — qmllint can't see
# the inheritance without the qs.* qmltypes. Pure cascade.
Quick.AttachedPropertyType=disable
