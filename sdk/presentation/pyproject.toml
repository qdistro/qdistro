[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qdistro-presentation"
version = "1.0.0"
description = "qdshell presentation snapshot model, publisher, and Qt adapter"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qt = ["PyQt6>=6.5"]
test = ["pytest>=7.0", "pytest-qt>=4.2"]

[project.scripts]
qdistro-presentation-publish = "qdistro_presentation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qdistro_presentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py311"
