# Inner weston config for tier-2 containers.
#
# - shell=qdwin-shell.so: when QDWIN_NESTED_MODE=1 is in env, the same
#   plugin that runs the outer compositor flips into nested-publisher
#   mode (qdwin.c §6.8 S1). Inner toplevels are captured to PipeWire
#   outputs and advertised on the outer via qdwin_nested_manager_v1.
#
# - backend=pipewire-backend.so: expose PipeWire outputs for the
#   per-toplevel pixel feed. The publisher's connection to the OUTER
#   compositor is made SEPARATELY by qdwin-shell.so's nested-mode code
#   (qdwin_nested_init -> its own wl_display_connect to
#   QDWIN_OUTER_DISPLAY), and inner-client input is delivered over the
#   QDNI input-sink into per-toplevel virtual seats — so the inner
#   weston does NOT need wayland-backend.so. wayland-backend.so was
#   previously listed here purely as the outer transport, but it ALSO
#   creates a host-output WINDOW (a regular app_id=null xdg_toplevel)
#   on the outer that shadowed the nested proxy in the outer's
#   pick_view, leaving active_input_proxy NULL so pointer input never
#   reached the nested compositor (F6#2). Dropping it removes that
#   phantom window at the source: the proxy is the only thing the
#   outer sees for this container, so pick_view resolves to it.
#
# - [pipewire] num-outputs=N pre-allocates the per-toplevel output
#   pool. Inner toplevels beyond N still render inside the nested
#   compositor but are not advertised to the outer (graceful degrade
#   per §6.8 S1 failure modes).
[core]
shell=qdwin-shell.so
backend=pipewire-backend.so
require-outputs=any

[pipewire]
num-outputs=8

[shell]
locking=false
