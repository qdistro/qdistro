<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Drop shadow -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="qgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54ff54"/>
      <stop offset="100%" stop-color="#18b218"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- Terminal window background with rounded corners -->
  <rect x="16" y="16" width="224" height="224" rx="24" ry="24"
        fill="url(#bggrad)" stroke="#3a3a3a" stroke-width="2"
        filter="url(#shadow)"/>

  <!-- Title bar strip -->
  <rect x="16" y="16" width="224" height="32" rx="24" ry="24" fill="#1e1e1e"/>
  <rect x="16" y="32" width="224" height="16" fill="#1e1e1e"/>

  <!-- Window control circles (red, yellow, green) -->
  <circle cx="36" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="32" r="6" fill="#27c93f"/>

  <!-- Faux terminal text lines in the background -->
  <g font-family="monospace" font-size="11" fill="#3a8b3a" opacity="0.5">
    <text x="32" y="74">$ ls -la</text>
    <text x="32" y="92">drwxr-xr-x  3 user</text>
    <text x="32" y="110">-rw-r--r--  1 user</text>
    <text x="32" y="218">$ _</text>
  </g>

  <!-- Big letter Q in foreground, vertically centered in the body -->
  <g filter="url(#shadow)">
    <text x="128" y="186"
          font-family="DejaVu Sans, sans-serif"
          font-size="180"
          font-weight="bold"
          fill="url(#qgrad)"
          text-anchor="middle"
          stroke="#0a0a0a"
          stroke-width="3">Q</text>
  </g>
</svg>
