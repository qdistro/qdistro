name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libqtermwidget6-3 libqtermwidget6-3-dev qtermwidget-data \
            g++ cmake qmake6 \
            libnotify-bin xvfb

      - name: Install Python build tooling
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyqt-builder sip pytest pytest-qt setproctitle

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build and install QTermWidget Python bindings
        run: just build-sip

      - name: Verify QTermWidget bindings
        run: python -c "from QTermWidget import QTermWidget; print('OK')"

      - name: Run tests (headless)
        run: |
          QT_QPA_PLATFORM=offscreen pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linters
        run: pip install ruff
      - name: Compile all Python files
        run: python -m compileall -q qterminator/ tests/

      # Align with the monorepo's central ruff posture: the SINGLE source of
      # truth is qdistro/ci/ruff-shared.toml (consumed by the qci host gate).
      # We check it out as a sibling and, when present, run ruff with that
      # profile as a BLOCKING step. The shared profile is calibrated GREEN on
      # this repo's current main (it enforces E/F/W/I minus the deferred
      # ratchets like F401/I001 that still have pre-existing hits here), so this
      # blocks only NEW violations and does not break the existing build.
      #
      # NOTE: this repo's plain `ruff check` (ruff defaults: E+F) is currently
      # RED here (~219 hits: F401/F811/...), which is exactly why we use the
      # shared profile rather than flipping the bare invocation to blocking.
      # The checkout is best-effort; if the profile is unreachable we fall back
      # to the previous NON-FATAL bare invocation so CI never breaks on a
      # transient checkout failure.
      - name: Checkout shared ruff profile (qdistro)
        uses: actions/checkout@v4
        with:
          repository: qdistro/qdistro
          path: .qdistro-ci
        continue-on-error: true
      - name: Ruff (shared profile, blocking when available)
        run: |
          set -euo pipefail
          CFG=.qdistro-ci/ci/ruff-shared.toml
          if [ -f "$CFG" ]; then
            echo "using shared profile: $CFG (blocking)"
            ruff check --config "$CFG" qterminator/ tests/
          else
            # TODO: shared profile unreachable -> non-fatal fallback. Target is
            # qdistro/ci/ruff-shared.toml; make this blocking once reachable.
            echo "shared profile not found; running non-fatal bare ruff"
            ruff check qterminator/ || true
          fi
