<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    spec/13 password manager. Two layers of access control:
    (1) D-Bus policy below restricts which uids/methods can send.
    (2) Daemon code re-checks uid for admin-only methods AND verifies
        per-item app-pin for GetItem (defense-in-depth).
    Both must agree before any caller gets a payload back.

    The daemon owns the bus name as the dedicated `qdistro-pwd` system
    user (created by install-pwd-for-vm.sh / fresh-vm-bootstrap.sh).
    Phase-8 MVP: the daemon runs as root if the qdistro-pwd uid isn't
    yet provisioned; production should run as the dedicated uid with
    SELinux qdistro_pwd_t (see spec/13 §"Daemon architecture").
  -->

  <!-- The daemon owns the bus name. Allow whichever uid runs it. -->
  <policy user="qdistro-pwd">
    <allow own="org.qdistro.Pwd1"/>
    <allow send_destination="org.qdistro.Pwd1"/>
    <allow receive_sender="org.qdistro.Pwd1"/>
  </policy>
  <policy user="root">
    <allow own="org.qdistro.Pwd1"/>
    <allow send_destination="org.qdistro.Pwd1"/>
    <allow receive_sender="org.qdistro.Pwd1"/>
  </policy>

  <!-- Admin role (uid 1000 = admin): full method set. -->
  <policy user="admin">
    <allow send_destination="org.qdistro.Pwd1"/>
    <allow receive_sender="org.qdistro.Pwd1"/>
  </policy>

  <!-- Everyone else: read-only operations + their own GetItem call.
       Admin-only methods (CreateVault, AddItem, DeleteItem, ListItems,
       GetItemAdmin, ListAuditLog) are denied at the bus level so a
       compromised non-admin uid can't even invoke them. -->
  <policy context="default">
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="ListVaults"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="VaultVersion"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="VaultInfo"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="IsUnlocked"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="UnlockVault"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="LockVault"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="GetItem"/>
    <!-- Phase-9a browser password autofill. Fill returns metadata only
         (no passwords); FillConfirm returns the password after user
         picks a credential. Save stores/updates a credential.
         Bus-level: restricted to admin uid. Daemon-side: caller
         identity verified via pin_match (defense-in-depth). -->
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="Fill"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="FillConfirm"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="Save"/>
    <!-- Phase-9d browser session cookie export. The browser bridge calls
         this for a user-gated "Export session cookies" action; the
         daemon kernel-attests the caller and audits every export.
         Bus-level: restricted to admin uid (the bridge runs as the
         desktop user, which on these VMs is the admin uid). Daemon-side:
         caller identity verified via _browser_bridge_allowed
         (defense-in-depth). -->
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="ExportCookies"/>
    <!-- Phase-8.3 portal Secret bridge. Per-app keys auto-provisioned
         on first call; daemon validates the caller uid and the
         portal-keys vault must be unlocked. -->
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.qdistro.Pwd1"
           send_member="GetPortalKey"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.qdistro.Pwd1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.qdistro.Pwd1"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="CreateVault"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="CreateVaultTPM"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="AddItem"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="DeleteItem"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="ListItems"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="GetItemAdmin"/>
    <deny send_destination="org.qdistro.Pwd1"
          send_interface="org.qdistro.Pwd1"
          send_member="ListAuditLog"/>
  </policy>
</busconfig>
