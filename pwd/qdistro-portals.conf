# qdistro xdg-desktop-portal backend routing (portals.conf(5)).
#
# Values are PORTAL NAMES — the basename of a .portal file in
# /usr/share/xdg-desktop-portal/portals/ with the extension stripped —
# NOT D-Bus names. qdistro ships two backends:
#
#   qdistro.portal              org.freedesktop.impl.portal.qdistro
#                               Access, FileChooser, Notification
#                               (install-portal-backend-for-vm.sh)
#   org.qdistro.PortalSecret    org.qdistro.PortalSecret
#                               Secret
#                               (install-pwd-for-vm.sh)
#
# Secret MUST be routed explicitly. `default=qdistro` alone sends it to
# qdistro.portal, which does not declare the Secret interface, so every
# Secret request failed to resolve a backend — the pwd portal daemon was
# unreachable even once it was activatable.
#
# This file is byte-identical to pwd/qdistro-portals.conf on purpose:
# install-pwd-for-vm.sh and install-portal-backend-for-vm.sh both write
# /usr/share/xdg-desktop-portal/qdistro-portals.conf and the chain runs
# pwd first, so whichever lands last must not drop the other's routing.
# tests/unit/test_session_unit_reachability.py pins the equality and the routing.
[preferred]
default=qdistro
org.freedesktop.impl.portal.Secret=org.qdistro.PortalSecret
