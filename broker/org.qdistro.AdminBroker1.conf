<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Two layers of access control:
    (1) D-Bus policy below restricts who can send each method.
    (2) Broker code re-checks uid for DecideRequest (defense-in-depth).
    Both must agree before a non-admin uid can decide.
  -->

  <!-- Only root owns the bus name (the broker runs as root). -->
  <policy user="root">
    <allow own="org.qdistro.AdminBroker1"/>
    <allow send_destination="org.qdistro.AdminBroker1"/>
    <allow receive_sender="org.qdistro.AdminBroker1"/>
  </policy>

  <!-- Admin role (uid 1000 = admin): full method set incl. DecideRequest. -->
  <policy user="admin">
    <allow send_destination="org.qdistro.AdminBroker1"/>
    <allow receive_sender="org.qdistro.AdminBroker1"/>
  </policy>

  <!-- Everyone else: may request a permission and wait for the answer,
       and receive signals; explicitly DENIED DecideRequest at the bus
       level so a misconfigured broker can't be tricked into approving. -->
  <policy context="default">
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="RequestPermission"/>
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="CheckPermission"/>
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="WaitForDecision"/>
    <!-- Phase 3: cross-user send-to. ListReceivers is the data source
         for "Send to…" menus; RelayMessage is the gated action (admin
         approval + one-shot scope enforced inside the broker). -->
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="ListReceivers"/>
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="RelayMessage"/>
    <!-- Bridge Phase 9c: browser "Send to…" share-to. The browser
         bridge runs as the browser's (non-admin) uid and forwards a
         page-extract action here. The broker derives the SOURCE from
         the authenticated caller uid (never the JSON body) and applies
         default-deny cross-user share-to policy, so any uid may call. -->
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="PageExtract"/>
    <!-- spec/19 Snapper bridge: SnapshotBefore is the non-admin SDK
         helper — "any caller can ask for a snapshot" (it's rate-limited
         via the same RateLimiter as RequestPermission, and the snapshot
         is tagged with the caller's authenticated uid). Listed
         explicitly so the contract doesn't ride the host system-bus
         default; ListSnapshots/GetFiles stay admin-only (denied below). -->
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="SnapshotBefore"/>
    <!-- spec/25 notification audit: RecordNotification is a passive,
         fire-and-forget recorder each silo's qdshell calls per shown
         notification. The broker keys the audit row on the caller's
         authenticated uid (never a client-supplied silo string), so any
         uid may call its own row. Listed explicitly rather than relying
         on the host system-bus default. -->
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.qdistro.AdminBroker1"
           send_member="RecordNotification"/>
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.qdistro.AdminBroker1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.qdistro.AdminBroker1"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="DecideRequest"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="GetPending"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RevokeApproval"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RevokeAllForUid"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RunAuditGc"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListCache"/>
    <!-- Workflow engine read-only surfaces: admin/root only (the admin
         app consumes them). Broker re-checks uid server-side. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListWorkflows"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListWorkflowRuns"/>
    <!-- Workflow approval (F3): admin/root only. A non-admin uid must not
         be able to approve (and thereby trigger execution of) a pending
         workflow run. Broker re-checks uid server-side. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ApproveWorkflowRun"/>
    <!-- Git-sign external-consume bridge: returns a workflow run's
         non-secret published channel_env refs (e.g. SSH_AUTH_SOCK) to the
         root-exec daemon. ROOT ONLY — denied for the default context;
         the broker also re-checks uid 0 server-side. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="GetRunChannelEnv"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ReloadRules"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RequestPermissionAs"/>
    <!-- Permission-lineage launch records (findings.md Phase 1):
         only root launchers may attest a child process's intended silo.
         The broker re-checks uid 0 server-side and re-verifies the
         registered pid against /proc (defense-in-depth). -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RegisterLaunch"/>
    <!-- Broker-central export lineage: only the root session-manager path may
         obtain receipt context or ask the broker to seal landed artifacts. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="GetLineageReceiptContext"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RecordExportLineage"/>
    <!-- Broker-central commit lineage: only the root signing path (qsu-wrapped
         commit / workflow git-sign) may ask the broker to record a commit
         chokepoint and seal its git-trailer receipt before signing. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RecordCommitLineage"/>
    <!-- Browser-upload lineage entry point: ROOT-ONLY. The upload chokepoint
         authorizes a source only by a global source_eid lookup and the store
         has no per-silo source-ownership model yet, so a non-root caller could
         mint a sealed upload receipt for any tracked source it can name
         (cross-silo source forgery). The method stays root-gated (and the
         bridge upload.record op unwired) until the production silo->source
         resolver binds sources to the authenticated silo. Broker also
         re-checks uid 0 server-side. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RecordUploadLineage"/>
    <!-- Permission-lineage portal path (Option A): only a root portal
         frontend may decide for an originating client pid it
         kernel-authenticated on the app's own connection. Broker re-checks
         uid 0 server-side and re-verifies the pid against /proc. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="CheckPermissionForClient"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RequestPermissionForClient"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RunCacheGc"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="SaveRule"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="DeleteRule"/>
    <!-- Read-only raw-YAML fetch for the admin app's rule editor:
         admin/root only (returns the verbatim contents of a file under
         /etc/qdistro/rules.d, which is root-owned). Broker re-checks
         uid and re-applies fail-closed path safety server-side. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="GetRuleSource"/>
    <!-- Cross-uid clipboard policy (spec/10): admin-only. Non-admin
         silos shouldn't be able to ask the broker to gate a transfer
         on someone else's behalf — qdshell (admin uid) is the only
         legitimate caller, since qdshell is the surface that observes
         seat selection signals on the admin compositor. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="CheckClipboardTransfer"/>
    <!-- Option-B identity re-verification (todo/decisions/
         secctx-identity-contract.md): admin-only. Only qdshell forwards
         the (pid, starttime, exe, label) tuple captured by qdwin. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="VerifyClientIdentity"/>
    <!-- Per-MIME clipboard receive gate (spec/10 v15): admin-only.
         qdshell (uid 1000) is the only legitimate caller; non-admin
         silos cannot ask the broker to gate a transfer on someone
         else's behalf. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="CheckClipboardReceive"/>
    <!-- Cross-uid handoff activation gate (spec/09): admin-only.
         Only qdshell legitimately observes xdg_activation_v1.activate
         on the admin compositor; non-admin silos cannot ask the
         broker to gate a transfer on someone else's behalf. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="CheckHandoffActivation"/>
    <!-- spec/30 step 7: SELinux AVC ingestion. Only the audispd
         plugin (root child of auditd) is a legitimate caller; the
         broker re-checks at the method level (uid 0 only) so the
         layered guard catches a future misconfigured policy. -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="RecordSelinuxAvc"/>
    <!-- Privileged read surfaces consumed by the admin app. Each
         re-checks uid server-side (ListHistory/ListPrintAudit/ListRules
         accept admin OR root; the Snapper pair below is admin-only), but
         list them at the bus level too so reachability matches the
         contract rather than the host system-bus default. -->
    <!-- History tab: audit + print-audit row listings (admin/root). -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListHistory"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListPrintAudit"/>
    <!-- Rules tab: loaded rule set (mirrors root-owned YAML). -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListRules"/>
    <!-- spec/19 Snapper bridge: read-only listing + per-file diff are
         admin-only — the broker requires uid == ADMIN_UID server-side
         (SnapshotBefore above is the only non-admin Snapper surface). -->
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="ListSnapshots"/>
    <deny send_destination="org.qdistro.AdminBroker1"
          send_interface="org.qdistro.AdminBroker1"
          send_member="GetFiles"/>
  </policy>
</busconfig>
