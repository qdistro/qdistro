# git-sign-commit — grant an SSH signing key to a git invocation for the
# duration of one commit, then scrub it. (permissions.md §"Secret delivery
# to privileged tasks".)
#
# Flow:
#   process_spawn(git in the watched cgroup)
#     -> conditions: uid==dev AND argv0==git  (ENFORCED, fail-closed: the
#        key is delivered only if the firing process really is dev's git,
#        not any process that lands in the cgroup)
#     -> deliver_secret: unseal vault/dev/github-ssh-key into a per-run
#        ssh-agent and publish SSH_AUTH_SOCK on the run context
#     -> wait_for_process: block on the triggering git pid (PID-reuse
#        anchored) until the commit finishes
#     -> scrub on workflow_exit: kill the agent, remove its socket dir
#
# EXTERNAL consumption via the qsu / root-exec bridge.
#   The agent socket is published on the *run context* (channel_env). An
#   externally launched git inherits it ONLY when launched through the
#   explicit run_id handshake:
#
#       qsu --workflow-run <RUN_ID> -- git -C /srv/repo commit -S ...
#
#   The root-exec daemon then asks the broker (GetRunChannelEnv, root-only)
#   for this run's allowlisted, NON-SECRET channel_env (SSH_AUTH_SOCK only)
#   and folds it into git's environment before exec. The lookup is:
#     - fail-closed + bounded: if the run has not reached the *published*
#       state (its deliver_secret step has not run) within the bounded
#       wait, the exec is REFUSED rather than running git with no agent;
#     - allowlisted: only SSH_AUTH_SOCK is ever exposed, never secret
#       material (the plaintext `env` delivery method is not publishable);
#     - UID-BOUND: the run is revealed only to a caller whose uid owns the
#       run's TRIGGERING process. A run_id leaks via the WorkflowRunPending
#       admin broadcast, so it is NOT a bearer token — another uid holding
#       it still cannot pull the socket.
#
#   ORDERING / CHOREOGRAPHY CAVEAT (important — read before relying on this
#   for a `process_spawn(git)` flow):
#     The run must already exist, be approved, and have PUBLISHED its
#     channel before root-exec reads it. In the pure `process_spawn` shape
#     the trigger fires only AFTER git is observed in the cgroup — but with
#     this bridge git is launched by root-exec, not by qsu directly, so the
#     trigger-pid identity is the wrong anchor and the deliver step cannot
#     have run yet at exec time. The bridge's short bounded wait covers a
#     small publish lag, NOT the full create→approve→deliver lifecycle.
#     A working external flow therefore needs a launcher that:
#       1. raises the run (e.g. a qbus_event / cron the dev triggers),
#       2. waits for it to be approved AND to publish SSH_AUTH_SOCK,
#       3. then runs `qsu --workflow-run <RUN_ID> -- git ...`.
#     The uid-binding uses the run's triggering process; for a non
#     process_spawn trigger that has no triggering pid the bridge fails
#     closed (no uid to bind to). For a fully self-contained signing flow
#     with no external launcher coordination, prefer the engine-launched
#     model in git-sign-inline.yaml — it is the recommended default.
#
# auto_run is OMITTED, so this defaults to FALSE: each fire parks a
# PENDING run for admin approval (ApproveWorkflowRun). Set `auto_run: true`
# only after an admin has decided this workflow may run unattended.
#
# This file is an EXAMPLE — copy it to /etc/qdistro/workflows/ (system) or
# ~/.config/qdistro/workflows/ (user) and adjust cgroup_pattern + the vault
# item to enable it. It is not installed/enabled by default.
- name: git-sign-commit
  description: >-
    Release the dev SSH signing key to a single git commit, then scrub.
  trigger:
    type: process_spawn
    # Match the cgroup git is launched into (e.g. via `qsu` / a wrapper
    # that drops git into a dedicated scope). Adjust to your launcher.
    cgroup_pattern: "system.slice/qdistro-git-sign-*.scope"
    poll_interval: 0.25
  conditions:
    - uid: dev
    - argv0: git
  needs:
    - vault/dev/github-ssh-key
  steps:
    - deliver_secret:
        item: vault/dev/github-ssh-key
        as: ssh-agent
        expose_as: SSH_AUTH_SOCK
        ttl: 120
        scrub_on: workflow_exit
    - wait_for_process: $trigger.pid
  roles:
    - dev: invoker
    - admin: approver
