# qdistro-polkit-agent — per-action method config.
#
# One ``glob = method`` line per row; ``#`` introduces a comment.
# Globs are fnmatch-style against the polkit action_id (NOT the
# qdistro-namespaced form). First-match wins.
#
# Methods:
#   pam      — password via PAM (admin types their password).
#   fprint   — fingerprint via fprintd.
#   broker   — yes/no admin vote via the qdistro admin broker
#              (default for any action that doesn't match below).
#
# Spec: spec/13 §"admin polkit AuthenticationAgent",
# doc/admin-approval.md (broker fallback path).

# qdistro password vault unlock — admin enters the actual admin
# password. fprintd is also acceptable: the admin can opt in by
# changing this line to ``com.qdistro.pwd.* = fprint``.
com.qdistro.pwd.* = pam

# Future qdistro polkit actions (printing, network, etc.) default
# to broker delegation — the admin's yes/no decision is enough,
# no explicit credential is needed.

# Other system actions (logind reboot, NetworkManager, etc.) also
# go through the broker path so the admin sees a unified queue.
