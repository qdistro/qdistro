# podman-as-silo fixed configuration (C2 model A): every podman call that
# runs under a qt3s-<silo> account sets CONTAINERS_CONF to this root-owned
# file. A silo account never has a logind session, so podman's default
# systemd cgroup manager can never attach and only warns before falling back;
# pinning cgroupfs makes the choice deterministic (containment is the
# root-owned transient scope, CONTRACT.md D-A3b) and keeps the warning noise
# out of unit logs and probe output. The file events logger likewise avoids
# the absent session bus. Storage settings are deliberately absent: the
# rootless store then defaults to the silo's own $HOME — one store per silo.
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
