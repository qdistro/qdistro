# qdistro tier 3s runtime directories (tier3s/CONTRACT.md "D-A1", "D-A8").
# Installed as /usr/lib/tmpfiles.d/qdistro-tier3s.conf and applied with
# `systemd-tmpfiles --create` at install time and at every boot. This is the
# ONLY creator of the runsc state root: the runtime wrapper, the spawn script
# and the cleanup refuse a missing one instead of making it.
#
# runsc state root, one per host uid (tier 3s uses the admin keep-id model,
# admin = uid 1000). The path must stay <= 31 characters (runsc control
# socket length), see tier3s-runsc.
d /run/qdistro-tier3s-runsc       0755 root root -
d /run/qdistro-tier3s-runsc/1000  0700 1000 1000 -
# Root-only control records: /run/qdistro-tier3s-ctl/<token>/state. Never
# mounted into a sandbox.
d /run/qdistro-tier3s-ctl         0700 root root -
# Parent of the admin-owned per-launch dirs /run/qdistro-tier3s/<token>
# (Phase B's bridge socket dir). Root-owned so admin cannot rename a token dir.
d /run/qdistro-tier3s             0755 root root -
# The tier3s launch stanzas the session manager writes for
# qdistro-tier3s-silo-launch (root-only, dedicated: never the shared tier-2
# silo-launch dir — paravirt ΔB5). The writer also re-verifies owner+mode;
# this line is the boot/install-time creator.
d /run/qdistro/tier3s-launch      0700 root root -
