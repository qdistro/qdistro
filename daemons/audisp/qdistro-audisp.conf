# audispd plugin descriptor — qdistro AVC ingestion (spec/30 step 7).
#
# auditd's dispatcher (audispd / audit-dispatch) reads this file at
# startup and on SIGHUP. Each `active = yes` plugin gets spawned as a
# long-lived child with audit records on stdin per the chosen format.
#
# Installed by daemons/audisp/install.sh to
# /etc/audit/plugins.d/qdistro-audisp.conf. The audit package sets
# the directory; we just drop a file in.
#
# format=string yields one line per record from
# auparse_get_record_text() — the human-readable form the kernel
# emits to /var/log/audit/audit.log. The plugin parses it with a
# small regex (qdistro_audisp_parser.parse_avc_line); raw/binary
# isn't worth the libauparse dep just for AVC fields.
#
# type=always so we get every record; the plugin filters AVC + qdistro
# in user-space. type=builtin would mean "use the in-process
# dispatcher" which is wrong for our case.

active = yes
direction = out
path = /usr/local/sbin/qdistro-audisp-plugin
type = always
format = string
