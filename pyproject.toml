# Minimal pyproject for pytest config. qdistro's Python modules are
# installed as flat .py files on target machines (each module lives
# next to its companions on the VM); this file exists purely so pytest
# can discover the unit tests + populate sys.path.

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
# Pin the Qt binding to PyQt6 in-repo (canonical selector; matches the sibling
# repos, qdgreeter being the model). pytest-qt otherwise auto-imports PySide6
# first if it is installed anywhere on the path, which loads PySide6's bundled
# libQt6Core.so and then breaks the subsequent PyQt6 import with a missing
# Qt_*_PRIVATE_API symbol error — silently SKIPPING the ~150 admin-app Qt
# tests. qci ALSO injects PYTEST_QT_API/QT_API/QDISTRO_REQUIRE_PYQT6 as
# defense-in-depth (the conftest turns the shadow into a hard failure); this
# declaration is now the primary selector.
qt_api = "pyqt6"
# Marker vocabulary (shared with ci/TAXONOMY.md). These let the fast host
# run deselect integration-grade tests that need real subprocesses/daemons:
#
#     python3 -m pytest -m "not slow and not needs_ssh"
#
# `cheat_aware` and `no_attest` are registered in tests/unit/conftest.py.
markers = [
  "slow: integration-grade test with real subprocesses or multi-second setup; deselect for the fast host subset with `-m 'not slow'`.",
  "integration: exercises more than one component together (still in-process, no VM).",
  "needs_ssh: requires ssh-agent/ssh-add/ssh-keygen on PATH; deselect with `-m 'not needs_ssh'`.",
]
# Promote module directories onto sys.path so tests can import
# qdistro_admin_*, qdistro_polkit_*, qdistro_pwd_*, etc. directly.
pythonpath = [
  "broker",
  "cli",
  "tui",
  "qsu",
  "polkit",
  "user_relay",
  "pwd",
  "print",
  "phone",
  "recall",
  "browser_bridge",
  "browser_daemons",
  "daemons",
  "snapshots",
  "sdk",
  "admin_app",
  "session_manager",
  "tier4-vm",
  "workflow",
  "templates",
]

# Linter config — house style across qdistro favours stacking trivial
# Qt setup statements with semicolons (admin_app/qdistro_admin_app.py
# is the reference); E702 is therefore explicitly off. Anything else
# the default ruff rule set flags is a real bug — leave the defaults.
[tool.ruff.lint]
ignore = ["E702"]
