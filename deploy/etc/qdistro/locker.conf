# qdlocker configuration file
# This file configures the screen locker behavior

# Idle timeout in seconds (default 300 = 5 minutes)
idle_timeout_s = 300

# Action to take on lid close ('lock' only for now)
lid_action = "lock"

# Whether to enable fprintd authentication. Test VMs and most virt-manager
# guests do not expose fingerprint devices, so keep password unlock direct.
fprintd_enabled = false

# Maximum number of failed fingerprint attempts before falling back to PAM (default 3)
fprintd_max_failures = 3

# Timeout for fingerprint verification in seconds (default 10)
fprintd_timeout_s = 10
