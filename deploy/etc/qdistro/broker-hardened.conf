# Hardened qdistro broker profile.
#
# This is intentionally separate from broker.conf until every installed tier
# launcher registers launch records by default. Copy into
# /etc/qdistro/broker.conf on hosts where qdwin/secctx and session-manager
# enforcement are deployed together.

secctx_launcher_gated = true
lineage_enforce = true
identity_strict = true
require_silo_active = true
