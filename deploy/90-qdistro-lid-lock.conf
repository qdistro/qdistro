# Configuration for handling lid close events in qdistro
# This file should be placed in /etc/systemd/logind.conf.d/ to override default behavior

[Login]
# When the lid is closed, lock the session (but don't suspend)
# This ensures that the locker is triggered but doesn't put the system to sleep
HandleLidSwitch=lock
# Also handle the case when docked
HandleLidSwitchDocked=lock
# Also handle the case when on external power
HandleLidSwitchExternalPower=lock