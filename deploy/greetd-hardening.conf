# qdistro systemd hardening drop-in for the distro-packaged greetd.service.
#
# Installed at /etc/systemd/system/greetd.service.d/10-qdistro-hardening.conf
# by qdistro-bootstrap.sh (configure_greetd) and image/config.sh.
#
# greetd MUST keep the ability to open VTs, run PAM, and transition to the
# session user, so PrivateUsers / RootDirectory / NoNewPrivileges=yes /
# ProtectKernelModules would break it and are intentionally omitted. These
# are the login-manager-compatible directives that still shrink the greeter
# (and the unprivileged `_greeter` it drops to) attack surface.
[Service]
ProtectSystem=strict
ReadWritePaths=/run /var/log /var/lib/systemd /dev
ProtectHome=read-only
ProtectControlGroups=yes
ProtectKernelTunables=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
PrivateTmp=yes
SystemCallArchitectures=native

# Finding 02 (qdgreeter): TCB no-network discipline. greetd and the `_greeter`
# it spawns to render the boot login talk only over AF_UNIX ($GREETD_SOCK,
# local PAM/NSS, journal) and AF_NETLINK (logind/udev); qdistro authenticates
# against LOCAL PAM only, so neither needs an inet socket. Without this the
# pre-auth greeter could open the network. The empty RestrictAddressFamilies=
# first RESETS any vendor allow-list so this drop-in OWNS the exact policy
# (drop-ins otherwise MERGE and could widen it); the second line is the policy.
# Verify effective value in the VM: `systemctl show -p RestrictAddressFamilies
# -p IPAddressDeny -p IPAddressAllow greetd.service`.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_NETLINK
IPAddressDeny=any
