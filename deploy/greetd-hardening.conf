# qdistro systemd hardening drop-in for the distro-packaged greetd.service.
#
# Installed at /etc/systemd/system/greetd.service.d/10-qdistro-hardening.conf
# by qdistro-bootstrap.sh (configure_greetd) and image/config.sh.
#
# greetd MUST keep the ability to open VTs, run PAM, and transition to the
# session user, so PrivateUsers / RootDirectory / NoNewPrivileges=yes /
# ProtectKernelModules would break it and are intentionally omitted. These
# are the login-manager-compatible directives that still shrink the greeter
# (and the unprivileged `_greeter` it drops to) attack surface.
[Service]
ProtectSystem=strict
ReadWritePaths=/run /var/log /var/lib/systemd /dev
ProtectHome=read-only
ProtectControlGroups=yes
ProtectKernelTunables=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
PrivateTmp=yes
SystemCallArchitectures=native
