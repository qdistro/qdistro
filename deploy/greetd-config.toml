# greetd config for tty3 — qdistro production session.
#
# Boot path:
#   greetd → qdgreeter (graphical PAM via greetd JSON-IPC) → qdwin-session.target
#
# Closes the P01 finding: greetd no longer launches LXQt+labwc as the
# default — the production session is qdwin via qdgreeter.

[terminal]
vt = 3

# Greeter: qdgreeter renders the boot login chrome and round-trips
# greetd's JSON-IPC for PAM. Runs as the unprivileged `_greeter`
# user; $GREETD_SOCK is inherited from greetd.
#
# Input/cursor: we deliberately do NOT pass QT_QPA_EGLFS_DISABLE_INPUT.
# eglfs only creates (and draws) a pointer cursor when it has an input
# device, so disabling input also means no visible mouse cursor on the
# login screen. Qt's libinput pointer drives the cursor; the keyboard is
# still owned by qdgreeter's raw-evdev bridge, which EVIOCGRABs the
# keyboard before Qt starts, so Qt never sees — and never double-types —
# key events (also why VT switching is handled in-app). qdgreeter forces
# the GL/software cursor via QT_QPA_EGLFS_KMS_CONFIG so it is visible on
# the VM's virtual GPU, which does not scan out a hardware cursor plane
# (see qdgreeter app.py _ensure_eglfs_software_cursor).
[default_session]
command = "env QT_QPA_PLATFORM=eglfs QT_QPA_EGLFS_INTEGRATION=eglfs_kms /usr/bin/qdgreeter"
user = "_greeter"

# Optional auto-login (disabled by default — keeps the boot greeter
# in the path). Enable by setting [initial_session].user and
# [initial_session].command if you want passwordless boot for a
# kiosk / developer VM. Intentionally left commented to make the
# password-required default obvious to anyone reading the config.
# [initial_session]
# user = "admin"
# command = "/usr/local/bin/qdwin-session-launcher"
