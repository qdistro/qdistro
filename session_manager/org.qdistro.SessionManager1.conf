<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Two layers of access control (mirrors broker pattern):
    (1) D-Bus policy below restricts who can send each method.
    (2) qdistro_session_manager._require_admin re-checks the caller
        uid in-process before any privileged op.
    Both must agree before a non-admin uid can touch a silo.
  -->

  <!-- Only root owns the bus name (the session manager runs as root). -->
  <policy user="root">
    <allow own="org.qdistro.SessionManager1"/>
    <allow send_destination="org.qdistro.SessionManager1"/>
    <allow receive_sender="org.qdistro.SessionManager1"/>
  </policy>

  <!-- Admin (uid 1000): full method set. -->
  <policy user="admin">
    <allow send_destination="org.qdistro.SessionManager1"/>
    <allow receive_sender="org.qdistro.SessionManager1"/>
  </policy>

  <!-- Everyone else: read-only (ListSilos) + signals, no lifecycle ops. -->
  <policy context="default">
    <allow send_destination="org.qdistro.SessionManager1"
           send_interface="org.qdistro.SessionManager1"
           send_member="ListSilos"/>
    <allow send_destination="org.qdistro.SessionManager1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.qdistro.SessionManager1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.qdistro.SessionManager1"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="CreateSilo"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="DeleteSilo"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="StartSilo"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="StopSilo"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="FreezeSilo"/>
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="ResumeSilo"/>
    <!-- The durable lifecycle audit log is admin-only. -->
    <deny send_destination="org.qdistro.SessionManager1"
          send_interface="org.qdistro.SessionManager1"
          send_member="ListAuditLog"/>
  </policy>
</busconfig>
